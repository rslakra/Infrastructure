name: Node.js - k8s-demo-app CI

# Two stages:
#   1. build-and-test (automatic): runs on every pull request and push. It installs the dependencies,
#      checks the code and builds the Docker image. Nothing is published.
#   2. publish (manual): run this workflow from the Actions tab ("Run workflow"). After build-and-test
#      passes, it pushes the image to GitHub Container Registry (uses the built-in GITHUB_TOKEN).
#      Tick "update_manifest" to also commit the new image tag to the ArgoCD config in this repo
#      (ArgoCD/argocd-app-config/dev/deployment.yaml), so ArgoCD deploys it. No extra secret is needed
#      because the config lives in this same repository.

env:
  IMAGE_NAME: ghcr.io/rslakra/k8s-demo-app
  APP_DIR: Node.js/k8s-demo-app
  CONFIG_BRANCH: master
  CONFIG_FILE: ArgoCD/argocd-app-config/dev/deployment.yaml

on:
  pull_request:
    paths:
      - "Node.js/k8s-demo-app/**"
      - ".github/workflows/nodejs-k8s-demo-app-ci.yml"
  push:
    branches: [master]
    paths:
      - "Node.js/k8s-demo-app/**"
      - ".github/workflows/nodejs-k8s-demo-app-ci.yml"
  workflow_dispatch:
    inputs:
      update_manifest:
        description: "Also update the image tag in ArgoCD/argocd-app-config/dev/deployment.yaml"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # The project has no automated tests yet (its "npm test" is a placeholder that fails),
      # so this only checks that the server code parses. Replace it with "npm test" once tests exist.
      - name: Check the code
        working-directory: ${{ env.APP_DIR }}
        run: node --check app/server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only builds the image (to catch a broken Dockerfile); it never pushes.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image to GitHub Container Registry
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifest:
    name: Update image tag in the ArgoCD config
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_manifest }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Same repository, so the built-in GITHUB_TOKEN is enough. This commit only touches the ArgoCD
      # folder (not in the "paths" filters above), and GITHUB_TOKEN pushes don't trigger workflows.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CONFIG_BRANCH }}

      - name: Point the deployment at the new image
        run: |
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" "${CONFIG_FILE}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Image tag is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "k8s-demo-app: deploy ${GITHUB_SHA::7}"
          git push origin "HEAD:${CONFIG_BRANCH}"
