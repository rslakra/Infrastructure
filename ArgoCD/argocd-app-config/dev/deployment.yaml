apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-app
spec:
  selector:
    matchLabels:
      app: k8s-demo-app
  replicas: 2
  template:
    metadata:
      labels:
        app: k8s-demo-app
    spec:
      containers:
      - name: k8s-demo-app
        # Built and pushed by the k8s-demo-app CI in this repo (Node.js/k8s-demo-app), which also updates this tag
        # to the commit it built (see this folder's README.md). Keep the "image:" line in this form.
        image: ghcr.io/rslakra/k8s-demo-app:9107e445c2d9e0b1460c16f7091620c81da31c75
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        # The host is the mongodb Service (mongodb.yaml).
        - name: MONGO_URL
          value: mongodb://mongouser:mongopassword@mongodb:27017
        - name: DB_NAME
          value: NodeApp
        - name: LOG_LEVEL
          value: info
